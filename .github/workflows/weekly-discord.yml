name: Weekly Discord notification

on:
  schedule:
    # 08:00 Europe/Budapest is 06:00 UTC in summer and 07:00 UTC in winter.
    - cron: '0 6 * * 0'
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Budapest local time
        id: check
        env:
          TZ: Europe/Budapest
        run: |
          local_day="$(date +%u)"
          local_time="$(date +%H:%M)"
          echo "Budapest local time: $(date '+%A %Y-%m-%d %H:%M %Z')"
          if [ "$local_day" = "7" ] && [[ "$local_time" > "07:59" ]] && [[ "$local_time" < "08:16" ]]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled send outside Sunday 08:00-08:15 Europe/Budapest."
          fi

      - name: Send Discord message
        if: steps.check.outputs.should_send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py
